<section class="banner animate__animated animate__backInDown">
  <div #carousel id="bannerCarousel" class="carousel slide">

    <div class="carousel-indicators">
      <button *ngFor="let banner of banners; let i = index"
              type="button"
              data-bs-target="#bannerCarousel"
              [attr.data-bs-slide-to]="i"
              [class.active]="i === 0"
              [attr.aria-current]="i === 0 ? 'true' : null"
              [attr.aria-label]="'Слайд ' + (i + 1)"></button>
    </div>

    <div class="carousel-inner">
      <div *ngFor="let banner of banners; let i = index"
           class="carousel-item"
           [class.active]="i === 0">
        <img [src]="banner.image" [alt]="banner.alt" class="d-block w-100">
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#bannerCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Назад</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#bannerCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Вперёд</span>
    </button>

  </div>
</section>
