<section class="order">
  <h2 class="order-title">Сделать заказ</h2>

  <div *ngIf="isSent" class="order-form__sent">Спасибо за заказ!</div>

  <form *ngIf="!isSent" id="order-form" [formGroup]="orderForm" (ngSubmit)="onSubmit()"
        class="animate__animated animate__backInUp" novalidate>

    <div class="row row-cols-1 row-cols-md-3 g-3 mb-3">
      <div class="order-form__item">
        <label for="name" class="form-label">Имя</label>
        <input type="text" class="form-control" id="name" formControlName="name"
               [class.is-invalid]="isInvalid('name')">
        <div class="invalid-feedback">Обязательное поле, только буквы</div>
      </div>

      <div class="order-form__item">
        <label for="last_name" class="form-label">Фамилия</label>
        <input type="text" class="form-control" id="last_name" formControlName="last_name"
               [class.is-invalid]="isInvalid('last_name')">
        <div class="invalid-feedback">Обязательное поле, только буквы</div>
      </div>

      <div class="order-form__item">
        <label for="phone" class="form-label">Телефон</label>
        <input type="tel" class="form-control" id="phone" formControlName="phone"
               [class.is-invalid]="isInvalid('phone')">
        <div class="invalid-feedback">11 цифр, можно с + в начале</div>
      </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-3 mb-3">
      <div class="order-form__item">
        <label for="country" class="form-label">Страна</label>
        <input type="text" class="form-control" id="country" formControlName="country"
               [class.is-invalid]="isInvalid('country')">
        <div class="invalid-feedback">Обязательное поле</div>
      </div>

      <div class="order-form__item">
        <label for="zip" class="form-label">Индекс</label>
        <input type="text" class="form-control" id="zip" formControlName="zip"
               [class.is-invalid]="isInvalid('zip')">
        <div class="invalid-feedback">Обязательное поле</div>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="order-form__item">
        <label for="product" class="form-label">Товар</label>
        <input type="text" class="form-control" id="product" formControlName="product">
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="order-form__item">
        <label for="address" class="form-label">Адрес</label>
        <input type="text" class="form-control" id="address" formControlName="address"
               [class.is-invalid]="isInvalid('address')">
        <div class="invalid-feedback">Буквы, цифры, пробелы, дефис и слеш</div>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="order-form__item">
        <label for="comment" class="form-label">Комментарий к заказу</label>
        <textarea class="form-control" id="comment" rows="3" formControlName="comment"></textarea>
      </div>
    </div>

    <div class="order-form__footer">
      <button type="submit" class="btn btn-order btn-primary hvr-back-pulse" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Отправляем…' : 'Отправить' }}
      </button>

      <span *ngIf="errorMessage" class="order-form__error">{{ errorMessage }}</span>
    </div>

  </form>
</section>
