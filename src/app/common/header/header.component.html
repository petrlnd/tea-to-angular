<header class="header">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/">
        <img src="assets/images/logo.png" alt="Чайная компания" class="logo" width="43" height="20">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/catalog" routerLinkActive="active">Каталог</a>
          </li>
        </ul>

        <form class="d-flex" (submit)="onSearch($event)">
          <div class="search-field me-2">
            <input class="form-control form-search" type="search" placeholder="Поиск чая"
                   aria-label="Поиск чая" [formControl]="searchControl">

            <button *ngIf="searchControl.value" type="button" class="btn-reset"
                    aria-label="Сбросить поиск" (click)="onReset()">&times;</button>
          </div>

          <button class="btn btn-outline-primary btn-search hvr-back-pulse" type="submit">Найти</button>
        </form>
      </div>
    </div>
  </nav>
</header>
